<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>messeze 관리자 — 문의 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#0A1930;--body:#4A5568;--mut:#8B95A7;--cobalt:#2B5CFF;--sky:#EAF1FF;--sky-2:#F5F8FD;--mint:#0BBF8C;--amber:#F59F1E;--red:#E2574C;--line:#E5EAF2;--sans:'Pretendard',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:#F2F5FA;line-height:1.6;-webkit-font-smoothing:antialiased}
.top{background:#0B1533;color:#fff;padding:16px 0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.top .wrap{display:flex;align-items:center;gap:12px}
.top svg{width:24px;height:24px}
.top b{font-size:17px;letter-spacing:-.02em}
.top .tag{font-size:11.5px;font-weight:800;background:rgba(43,92,255,.25);color:#9DC0FF;border-radius:999px;padding:4px 11px;margin-left:4px}
.top a{margin-left:auto;color:#8FA6D9;font-size:13px;text-decoration:none;font-weight:600}
.top a:hover{color:#fff}
main{padding:34px 0 80px}
/* 키 게이트 */
body.gated{background:#F1EFEA}
body.gated .vtabs{display:none}
.gate{max-width:440px;margin:64px auto;background:#fff;border-radius:24px;padding:44px 40px 34px;box-shadow:0 24px 60px rgba(40,36,24,.1)}
.gate .glogo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:26px}
.gate .glogo svg{width:44px;height:44px;color:#101B3A}
.gate .glogo .wm{font-weight:900;font-size:19px;letter-spacing:-.02em;color:#101B3A}
.gate h1{font-size:19px;letter-spacing:.14em;text-align:center;color:#2A2E3A;margin-bottom:26px}
.gate label{display:block;font-size:13px;font-weight:700;color:#3A4152;margin:16px 2px 7px}
.gate input{width:100%;border:1px solid #E7E4DC;background:#F7F5F0;border-radius:12px;padding:14px 16px;font-family:var(--sans);font-size:15px}
.gate input:focus{outline:none;border-color:var(--cobalt);background:#fff}
.gate .err{color:#E2574C;font-size:13px;font-weight:700;margin-top:16px;display:none;text-align:center}
.gate button{width:100%;margin-top:16px;background:var(--cobalt);color:#fff;border:0;border-radius:12px;padding:15px;font-family:var(--sans);font-weight:800;font-size:16px;cursor:pointer;transition:.15s}
.gate button:hover{background:#1E46D9}
.gate .gfoot{text-align:center;font-size:12.5px;color:#8B95A7;margin-top:18px}
/* 설정 안내 */
.setup{max-width:640px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:0 20px 50px rgba(16,31,63,.08)}
.setup h1{font-size:20px}
.setup p{font-size:14px;color:var(--body);margin-top:12px;line-height:1.7}
.setup code{background:var(--sky-2);border-radius:6px;padding:2px 7px;font-size:12.5px}
/* 대시보드 */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.bar h1{font-size:20px;letter-spacing:-.02em}
.bar .cnt{font-size:13px;color:var(--mut);font-weight:700}
.bar button{margin-left:auto;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 16px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer}
.bar button:hover{border-color:var(--cobalt);color:var(--cobalt)}
.bar .out{background:none;border:0;color:var(--mut);font-size:12.5px;cursor:pointer;margin-left:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.st b{font-size:24px;font-weight:800;display:block}
.st span{font-size:12px;color:var(--mut);font-weight:700}
.st.new b{color:var(--cobalt)}
.tbl{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--sky-2);text-align:left;padding:12px 14px;font-size:12px;color:var(--mut);letter-spacing:.02em;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
td.ts{white-space:nowrap;color:var(--mut);font-size:12px}
td b{font-size:14px}
td .co{color:var(--body);font-size:12.5px;display:block}
td a{color:var(--cobalt);font-weight:700;text-decoration:none}
select{font-family:var(--sans);font-weight:700;font-size:12.5px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
select.s-신규{color:var(--cobalt);border-color:#B9CCFF;background:var(--sky)}
select.s-연락중{color:var(--amber);border-color:#F5D9A8;background:#FFF7E8}
select.s-계약{color:#0B8F5C;border-color:#9FDFC4;background:#E7F8F0;font-weight:800}
select.s-보류{color:var(--red);border-color:#F2C1C1;background:#FCEFEF}
select.s-완료{color:var(--mut);border-color:var(--line);background:var(--sky-2)}
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ftabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-family:var(--sans);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--body)}
.ftabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ftabs .srch{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-family:var(--sans);font-size:13px}
.ftabs .srch:focus{outline:none;border-color:var(--cobalt)}
.memo{width:170px;font-family:var(--sans);font-size:12.5px;border:1.5px solid transparent;border-radius:8px;padding:6px 8px;background:var(--sky-2)}
.memo:focus{outline:none;border-color:var(--cobalt);background:#fff}
.empty{padding:50px;text-align:center;color:var(--mut);font-size:14px}
.load{padding:50px;text-align:center;color:var(--mut)}
/* 뷰 탭 */
.vtabs{background:#101B3A;padding:0}
.vtabs .wrap{display:flex;gap:4px}
.vtabs button{background:none;border:0;color:#8FA6D9;font-family:var(--sans);font-weight:700;font-size:14px;padding:13px 18px;cursor:pointer;border-bottom:2.5px solid transparent}
.vtabs button.on{color:#fff;border-bottom-color:var(--cobalt)}
/* CMS */
.cms-types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cms-types button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 18px;font-family:var(--sans);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--body)}
.cms-types button.on{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.cms-note{font-size:12.5px;color:var(--mut);margin-bottom:14px;line-height:1.6}
.cms-list{display:flex;flex-direction:column;gap:8px}
.cms-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.cms-item:hover{border-color:#B9CCFF}
.cms-item b{font-size:14.5px}
.cms-item span{font-size:12px;color:var(--mut)}
.cms-item .idx{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--sky);color:var(--cobalt);font-weight:800;font-size:12px;display:grid;place-items:center}
.ed-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.ed-bar .back{background:none;border:0;color:var(--cobalt);font-weight:800;font-size:13.5px;cursor:pointer;font-family:var(--sans);padding:6px 0}
.ed-bar .sp{flex:1}
.ed-bar .save{background:var(--cobalt);color:#fff;border:0;border-radius:10px;padding:11px 22px;font-family:var(--sans);font-weight:800;font-size:14px;cursor:pointer}
.ed-bar .save:hover{background:#1E46D9}
.ed-bar .del{background:#fff;border:1.5px solid #F2C1C1;color:var(--red);border-radius:10px;padding:10px 16px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer}
.ed-bar .dup{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer}
.ed{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.fgrp{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;background:var(--sky-2)}
.fgrp>.glab{font-size:12px;font-weight:800;color:var(--cobalt);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.fgrp .rowdel{margin-left:auto;background:none;border:0;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.addrow{background:#fff;border:1.5px dashed var(--line-2);border-radius:10px;padding:9px;width:100%;font-family:var(--sans);font-weight:700;font-size:12.5px;color:var(--cobalt);cursor:pointer;margin-top:6px}
.fld2{margin:10px 0}
.fld2 label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:5px}
.fld2 input,.fld2 textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--sans);font-size:13.5px;background:#fff}
.fld2 textarea{min-height:74px;resize:vertical;line-height:1.6}
.fld2 textarea.big{min-height:220px;font-size:12.5px}
.fld2 input:focus,.fld2 textarea:focus{outline:none;border-color:var(--cobalt)}
.tok-box{background:#FFF7E8;border:1px solid #F5D9A8;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:12.5px;color:#854F0B;line-height:1.6}
.tok-box input{width:100%;margin-top:8px;border:1.5px solid #F5D9A8;border-radius:8px;padding:9px 12px;font-family:var(--sans);font-size:13px}
.msg-ok{background:#E7F8F0;border:1px solid #9FDFC4;color:#0B8F5C;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:12px}
.msg-err{background:#FCEFEF;border:1px solid #F2C1C1;color:var(--red);border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:12px}
/* 이미지 필드 */
.imgfld{display:flex;gap:12px;align-items:flex-start}
.imgfld .thumbbox{flex:0 0 auto;width:110px;height:72px;border-radius:10px;border:1px solid var(--line);background:#F3F5F9 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="%23A9B4C9" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>') center no-repeat;overflow:hidden}
.imgfld .thumbbox img{width:100%;height:100%;object-fit:cover;display:block}
.imgfld .ctrls{flex:1;min-width:0}
.upbtn{margin-top:7px;background:#fff;border:1.5px solid var(--cobalt);color:var(--cobalt);border-radius:9px;padding:8px 14px;font-family:var(--sans);font-weight:800;font-size:12.5px;cursor:pointer}
.upbtn:hover{background:var(--sky)}
.upbtn:disabled{opacity:.5;cursor:wait}
.uphint{font-size:11.5px;color:var(--mut);margin-top:5px}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.tbl{overflow-x:auto}table{min-width:760px}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
<svg viewBox="0 0 100 100" fill="none"><path d="M38 24 16 71" stroke="#fff" stroke-width="17" stroke-linecap="round"/><path d="M72 24 51 71" stroke="#2B5CFF" stroke-width="17" stroke-linecap="round"/><circle cx="85" cy="69" r="9" fill="#2B5CFF"/></svg>
<b>messeze</b><span class="tag">ADMIN</span>
<a href="index.html">사이트로 →</a>
</div></div>
<div class="vtabs"><div class="wrap">
<button data-v="inq" class="on">📥 문의 관리</button>
<button data-v="chk">🔍 가시성 체크</button>
<button data-v="cms">✏️ 콘텐츠 관리</button>
<button data-v="rpt">📊 진단 리포트</button>
</div></div>

<main><div class="wrap" id="app"></div></main>

<script>
/* ⚙️ 구글 Apps Script 웹앱 URL — 설정 가이드(관리자-설정-가이드.md) 완료 후 여기에 붙여넣기 */
const APPS_URL = 'https://script.google.com/macros/s/AKfycbzBWMloPYJjGqCdxzHbsI8psVm-MOf1iFtsVPLSHpvEWZeGNH4wrtZJG_se5GGzJPpk/exec';

const app = document.getElementById('app');
const KEY_LS = 'mz_admin_key';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function showSetup(){
  app.innerHTML = `<div class="setup"><h1>⚙️ 아직 연결 설정 전입니다</h1>
  <p>문의 데이터를 저장할 <b>구글 시트 연결</b>이 필요합니다. 프로젝트 폴더의 <code>관리자-설정-가이드.md</code>를 따라 5분만 설정하면:</p>
  <p>① 홈페이지 문의가 구글 시트에 자동 저장되고<br>② 이 페이지에서 문의 목록 확인·상태 관리·메모가 가능해집니다.</p>
  <p style="margin-top:16px;color:var(--mut);font-size:12.5px">설정 후 발급된 웹앱 URL을 <code>admin.html</code>과 <code>index.html</code>의 <code>APPS_URL</code>에 넣으면 활성화됩니다.</p></div>`;
}

function showGate(msg){
  document.body.classList.add('gated');
  app.innerHTML = `<div class="gate">
  <div class="glogo">
    <svg viewBox="0 0 100 100" fill="none"><path d="M38 24 16 71" stroke="currentColor" stroke-width="17" stroke-linecap="round"/><path d="M72 24 51 71" stroke="#2B5CFF" stroke-width="17" stroke-linecap="round"/><circle cx="85" cy="69" r="9" fill="#2B5CFF"/></svg>
    <span class="wm">messeze</span>
  </div>
  <h1>MESSEZE ADMIN</h1>
  <label for="gid">아이디</label>
  <input id="gid" type="text" autocomplete="username" value="${esc(localStorage.getItem('mz_admin_id')||'')}">
  <label for="key">비밀번호</label>
  <input id="key" type="password" autocomplete="current-password">
  <div class="err" id="gerr">${esc(msg||'')}</div>
  <button id="go">로그인</button>
  <div class="gfoot">메세지닷컴 문의·콘텐츠 관리자 페이지입니다.</div>
  </div>`;
  if(msg) document.getElementById('gerr').style.display='block';
  const tryGo = ()=>{
    const id=document.getElementById('gid').value.trim();
    const k=document.getElementById('key').value.trim();
    if(!id||!k){const e=document.getElementById('gerr');e.textContent='아이디와 비밀번호를 입력하세요.';e.style.display='block';return;}
    try{localStorage.setItem('mz_admin_id',id);}catch(e){}
    load(k);
  };
  document.getElementById('go').onclick = tryGo;
  [document.getElementById('gid'),document.getElementById('key')].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')tryGo()}));
  (localStorage.getItem('mz_admin_id')?document.getElementById('key'):document.getElementById('gid')).focus();
}

let LAST={key:null,rows:[],checks:[]};
async function load(key,view){
  app.innerHTML = '<div class="load">불러오는 중…</div>';
  try{
    const r = await fetch(APPS_URL+'?key='+encodeURIComponent(key)+'&t='+Date.now());
    const j = await r.json();
    if(!j.ok){localStorage.removeItem(KEY_LS);return showGate('아이디 또는 비밀번호가 올바르지 않습니다.');}
    sessionStorage.setItem(KEY_LS,key);
    document.body.classList.remove('gated');
    LAST={key:key,
      rows:(j.rows||[]).filter(r=>String(r.name||'')||String(r.company||'')||String(r.phone||'')||String(r.memo||'')),
      checks:(j.checks||[]).filter(c=>String(c.site||''))};
    view==='chk' ? renderChk() : render(key, LAST.rows);
  }catch(e){
    showGate('불러오기 실패 — 네트워크 또는 설정을 확인하세요.');
  }
}

/* ── 가시성 체크 목록 ── */
function fmtTs(ts){
  try{const d=new Date(ts);if(isNaN(d))return String(ts);
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}catch(e){return String(ts)}
}
function renderChk(){
  const list=LAST.checks||[];
  app.innerHTML=`<h1 style="margin:26px 0 6px">가시성 체크 목록 · ${list.length}건</h1>
  <p class="cms-note">홈페이지에서 <b>무료 AI 가시성 진단</b>을 돌린 방문자 기록입니다 — 이미 관심을 보인 잠재 고객이니, 버튼 한 번으로 진단 리포트를 만들어 연락해 보세요.</p>
  ${list.length?'':'<div class="empty">아직 기록이 없습니다. Apps Script를 새 코드로 교체하고 "새 버전 배포"한 뒤부터 쌓입니다.</div>'}
  <div class="cms-list">${list.map((c,i)=>{
    const sc=Number(c.score), col=sc>=80?'#0BBF8C':(sc>=50?'#B45309':'#E2574C');
    return `<div class="cms-item" style="cursor:default">
      <span class="idx">${list.length-i}</span>
      <div style="flex:1;min-width:0"><b>${esc(String(c.site||'').replace(/^https?:\/\//,'').replace(/\/$/,''))}</b><br><span>${esc(fmtTs(c.ts))}</span></div>
      <span style="font-weight:900;font-size:17px;color:${col};flex:0 0 auto">${isNaN(sc)?'-':sc+'점'}</span>
      <button class="dup" style="flex:0 0 auto" data-site="${esc(c.site||'')}">📊 진단 리포트 생성</button>
    </div>`}).join('')}</div>`;
  document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.vtabs button').forEach(t=>t.classList.toggle('on',t.dataset.v==='rpt'));
    rptHome(b.dataset.site);
  });
}

function render(key, rows){
  const stat = s => rows.filter(r=>(r.status||'신규')===s).length;
  const OPTS = ['신규','연락중','계약','보류','완료'];
  const fmt = r => {
    const st = r.status||'신규';
    const d = r.ts ? new Date(r.ts) : null;
    const ts = d ? `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}<br>${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '';
    const site = r.site ? `<a href="${esc(r.site)}" target="_blank" rel="noopener">${esc(String(r.site).replace(/^https?:\/\//,'').slice(0,22))}</a>` : '<span style="color:var(--mut)">—</span>';
    return `<tr>
      <td class="ts">${ts}</td>
      <td><b>${esc(r.name)}</b><span class="co">${esc(r.company)}</span></td>
      <td><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></td>
      <td>${site}</td>
      <td><select class="s-${st}" data-row="${r.row}">${OPTS.map(o=>`<option ${o===st?'selected':''}>${o}</option>`).join('')}</select></td>
      <td><input class="memo" data-row="${r.row}" value="${esc(r.memo)}" placeholder="메모"></td>
    </tr>`;
  };
  let fltSt = '전체', fltQ = '';
  const visible = () => rows.filter(r=>{
    const st = r.status||'신규';
    if(fltSt!=='전체' && st!==fltSt) return false;
    if(fltQ){
      const hay = [r.name,r.company,r.phone,r.site,r.memo].join(' ').toLowerCase();
      if(!hay.includes(fltQ.toLowerCase())) return false;
    }
    return true;
  });
  app.innerHTML = `
  <div class="bar"><h1>문의 관리</h1><span class="cnt" id="cnt"></span>
    <button id="csv">CSV 다운로드</button><button id="rf">새로고침</button><button class="out" id="out">로그아웃</button></div>
  <div class="stats">
    <div class="st new"><b>${stat('신규')}</b><span>신규</span></div>
    <div class="st"><b>${stat('연락중')}</b><span>연락중</span></div>
    <div class="st" style="border:1.5px solid #9FDFC4"><b style="color:#0B8F5C">${stat('계약')}</b><span>계약</span></div>
    <div class="st"><b>${rows.length}</b><span>전체</span></div>
  </div>
  <div class="ftabs">
    ${['전체',...OPTS].map(s=>`<button data-st="${s}" class="${s==='전체'?'on':''}">${s}</button>`).join('')}
    <input class="srch" id="srch" placeholder="이름·회사·연락처·메모 검색" autocomplete="off">
  </div>
  <div class="tbl" id="tblwrap"></div>`;
  const draw = () => {
    const v = visible();
    document.getElementById('cnt').textContent = fltSt==='전체'&&!fltQ ? `총 ${rows.length}건` : `${v.length}건 / 전체 ${rows.length}건`;
    document.getElementById('tblwrap').innerHTML = v.length
      ? `<table><thead><tr><th>접수일시</th><th>이름 / 회사</th><th>연락처</th><th>홈페이지</th><th>상태</th><th>메모</th></tr></thead><tbody>${v.map(fmt).join('')}</tbody></table>`
      : `<div class="empty">${rows.length?'조건에 맞는 문의가 없습니다.':'아직 접수된 문의가 없습니다.'}</div>`;
    document.querySelectorAll('#tblwrap select').forEach(sel=>sel.addEventListener('change',async()=>{
      sel.className='s-'+sel.value;
      const row = rows.find(r=>String(r.row)===sel.dataset.row); if(row) row.status = sel.value;
      await fetch(APPS_URL,{method:'POST',body:JSON.stringify({action:'update',key,row:sel.dataset.row,status:sel.value})});
    }));
    document.querySelectorAll('#tblwrap .memo').forEach(inp=>inp.addEventListener('change',async()=>{
      const row = rows.find(r=>String(r.row)===inp.dataset.row); if(row) row.memo = inp.value;
      await fetch(APPS_URL,{method:'POST',body:JSON.stringify({action:'update',key,row:inp.dataset.row,memo:inp.value})});
    }));
  };
  draw();
  document.querySelectorAll('.ftabs button[data-st]').forEach(b=>b.onclick=()=>{
    fltSt=b.dataset.st;
    document.querySelectorAll('.ftabs button[data-st]').forEach(x=>x.classList.toggle('on',x===b));
    draw();
  });
  document.getElementById('srch').addEventListener('input',e=>{fltQ=e.target.value.trim();draw();});
  document.getElementById('csv').onclick = () => {
    const head = ['접수일시','이름','회사명','연락처','홈페이지','상태','메모'];
    const lines = [head.join(',')].concat(visible().map(r=>{
      const d = r.ts?new Date(r.ts):null;
      const ts = d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'';
      return [ts,r.name,r.company,r.phone,r.site,r.status||'신규',r.memo].map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',');
    }));
    const blob = new Blob(["﻿"+lines.join("\n")],{type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'messeze_문의목록.csv';
    a.click(); URL.revokeObjectURL(a.href);
  };
  document.getElementById('rf').onclick = ()=>load(key);
  document.getElementById('out').onclick = ()=>{localStorage.removeItem(KEY_LS);showGate();};
}

/* ───────────────────────── 콘텐츠 관리 (CMS) ───────────────────────── */
const REPO='mina0313/messeze', BR='master', TOK_LS='mz_gh_token';
const TYPES=[
 {key:'faq',    file:'data/faq.json',        name:'FAQ',     label:g=>g.title,            sub:g=>`문항 ${g.items.length}개`},
 {key:'interview',file:'data/interviews.json',name:'인터뷰',  label:c=>`${c.com}`,          sub:c=>c.who||''},
 {key:'glossary',file:'data/glossary.json',   name:'용어사전', label:t=>t.ko||t.slug,        sub:t=>t.en||''},
 {key:'blog',   file:'data/posts.json',       name:'블로그',   label:p=>p.title,             sub:p=>p.date||''},
];
/* 필드 한글 라벨 */
const LBL={q:'질문',a:'답변',photo:'사진',title:'제목',items:'문항 목록',id:'ID(주소용, 영문)',com:'회사/업체명',who:'담당자·직함',slug:'주소(영문)',ko:'용어(한글)',en:'영문',cat:'카테고리',date:'날짜',desc:'설명',summary:'요약',body:'본문',tags:'태그',metrics:'지표',weeks:'주차별 등장률(%)',quote:'인용문',industry:'업종',period:'기간',kws:'키워드',engines:'AI 엔진별',before:'이전',after:'이후',name:'이름',read:'읽는 시간',intro:'도입부',sections:'섹션들',h:'소제목',p:'문단',rel:'관련 용어',faq:'FAQ',def:'정의',eg:'예시',long:'상세 설명'};
const lbl=k=>LBL[k]||k;
const CMS={type:null,arr:null,sha:null,idx:null};

function b64dec(b){const bin=atob(b.replace(/\n/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function b64enc(s){const u=new TextEncoder().encode(s);let bin='';for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(bin)}
const ghH=t=>({Accept:'application/vnd.github+json',...(t?{Authorization:'Bearer '+t}:{})});
const SITE='https://mina0313.github.io/messeze/';
const isImgField=(k,v)=>/^(photo|img|image|cover|thumb|logo|avatar|pic)$/i.test(k)||/^https?:\/\/\S+\.(png|jpe?g|webp|gif|svg)(\?|$)/i.test(v||'')||/(images\.unsplash\.com|images\.pexels\.com)/.test(v||'');

/* 토큰이 없으면 안내 박스 띄우고, 입력되면 then 실행 */
function askToken(then){
  const tok=localStorage.getItem(TOK_LS);
  if(tok)return then(tok);
  const msg=document.getElementById('edMsg');
  msg.innerHTML=`<div class="tok-box"><b>처음 한 번만:</b> GitHub 토큰이 필요합니다.<br>
  github.com 로그인 → Settings → Developer settings → <b>Fine-grained tokens</b> → Generate new token → Repository: <b>messeze</b>만 선택 → Permissions에서 <b>Contents: Read and write</b> → 생성된 토큰(github_pat_…)을 아래에 붙여넣기.
  <input id="tokIn" type="password" placeholder="github_pat_… 붙여넣기 후 Enter"></div>`;
  const inp=document.getElementById('tokIn');inp.focus();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim()){localStorage.setItem(TOK_LS,inp.value.trim());msg.innerHTML='';then(inp.value.trim());}});
}

/* 사진 파일 → (필요시 축소) → GitHub assets/uploads/ 업로드 → 사이트 주소 반환 */
async function pickAndUpload(btn){
  return new Promise(resolve=>{
    const fi=document.createElement('input');fi.type='file';fi.accept='image/*';
    fi.onchange=async()=>{
      const f=fi.files[0];if(!f)return resolve(null);
      askToken(async tok=>{
        btn.disabled=true;const orig=btn.textContent;btn.textContent='올리는 중…';
        try{
          let blob=f;
          if(/image\/(jpe?g|png|webp)/.test(f.type)&&f.size>250*1024){
            const bmp=await createImageBitmap(f);
            const sc=Math.min(1,1600/bmp.width);
            const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
            cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
            blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
          }
          const buf=new Uint8Array(await blob.arrayBuffer());
          let bin='';for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode(...buf.subarray(i,i+8192));
          const ext=blob.type==='image/jpeg'?'jpg':(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
          const name=`up-${Date.now()}.${ext}`;
          const r=await fetch(`https://api.github.com/repos/${REPO}/contents/assets/uploads/${name}`,{method:'PUT',headers:{...ghH(tok),'Content-Type':'application/json'},body:JSON.stringify({message:'admin: 사진 업로드 '+name,content:btoa(bin),branch:BR})});
          if(r.status===401||r.status===403){localStorage.removeItem(TOK_LS);alert('토큰이 유효하지 않습니다. 버튼을 다시 눌러 새 토큰을 입력하세요.');return resolve(null);}
          if(!r.ok)throw 0;
          resolve(SITE+'assets/uploads/'+name);
        }catch(e){alert('업로드 실패 — 인터넷 연결 또는 토큰 권한을 확인하세요.');resolve(null);}
        finally{btn.disabled=false;btn.textContent=orig;}
      });
    };
    fi.click();
  });
}

async function cmsLoad(key){

function cmsList(){

/* 값 타입별 폼 렌더 — data-path로 위치 기록 */
function fld(val,path,key){
  const P=esc(path);
  if(typeof val==='number')return`<div class="fld2"><label>${esc(lbl(key))}</label><input type="number" data-path="${P}" value="${val}"></div>`;
  if(typeof val==='string'){
    if(isImgField(key,val))
      return`<div class="fld2"><label>${esc(lbl(key))}</label><div class="imgfld">
      <div class="thumbbox">${val?`<img src="${esc(val)}" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>
      <div class="ctrls"><input data-path="${P}" value="${esc(val)}" placeholder="사진 주소(URL) — 아래 버튼으로 올리면 자동 입력">
      <button type="button" class="upbtn" data-upl="${P}">📷 내 컴퓨터에서 사진 올리기</button>
      <div class="uphint">올리면 사이트 저장소에 보관되고 주소가 자동으로 채워집니다. 비워두면 기본 이미지가 쓰입니다.</div></div></div></div>`;
    const long=val.length>70||val.includes('<');
    return`<div class="fld2"><label>${esc(lbl(key))}</label>${long?`<textarea data-path="${P}" class="${val.length>400?'big':''}">${esc(val)}</textarea>`:`<input data-path="${P}" value="${esc(val)}">`}</div>`;
  }
  if(Array.isArray(val)){
    const rows=val.map((v,i)=>{
      const inner=(typeof v==='object'&&v!==null)
        ?Object.entries(v).map(([k2,v2])=>fld(v2,`${path}.${i}.${k2}`,k2)).join('')
        :fld(v,`${path}.${i}`,key+' '+(i+1)).replace(/<label>.*?<\/label>/,'');
      return`<div class="fgrp"><div class="glab">${esc(lbl(key))} ${i+1}<button class="rowdel" data-del="${P}" data-i="${i}">✕ 삭제</button></div>${inner}</div>`;
    }).join('');
    return`<div class="fld2"><label>${esc(lbl(key))}</label>${rows}<button class="addrow" data-add="${P}">+ ${esc(lbl(key))} 추가</button></div>`;
  }
  if(typeof val==='object'&&val!==null)
    return`<div class="fgrp"><div class="glab">${esc(lbl(key))}</div>${Object.entries(val).map(([k2,v2])=>fld(v2,`${path}.${k2}`,k2)).join('')}</div>`;
  return'';
}
const getP=(o,p)=>p.split('.').reduce((a,k)=>a[k],o);
const setP=(o,p,v)=>{const ks=p.split('.');const last=ks.pop();let cur=o;for(const k of ks)cur=cur[k];cur[last]=v;};

function cmsEdit(i){
  CMS.idx=i;const it=CMS.arr[i],t=CMS.type;
  document.getElementById('cmsBody').innerHTML=`
  <div class="ed-bar">
    <button class="back" id="edBack">← ${t.name} 목록</button><span class="sp"></span>
    <button class="dup" id="edImg">📷 본문용 사진 올리기</button>
    <button class="dup" id="edDup">복제</button>
    <button class="del" id="edDel">삭제</button>
    <button class="save" id="edSave">💾 저장 → 사이트 반영</button>
  </div>
  <div id="edMsg"></div>
  <div class="ed">${Object.entries(it).map(([k,v])=>fld(v,k,k)).join('')}</div>`;
  const collect=()=>{
    document.querySelectorAll('#cmsBody [data-path]').forEach(el=>{
      const v=el.type==='number'?Number(el.value):el.value;
      setP(it,el.dataset.path,v);
    });
  };
  document.getElementById('edBack').onclick=()=>{collect();cmsList()};
  document.getElementById('edDup').onclick=()=>{collect();CMS.arr.splice(i+1,0,JSON.parse(JSON.stringify(it)));cmsEdit(i+1)};
  document.getElementById('edDel').onclick=()=>{if(confirm('이 항목을 삭제할까요? 저장을 눌러야 사이트에 반영됩니다.')){CMS.arr.splice(i,1);cmsList()}};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{collect();getP(it,b.dataset.del).splice(+b.dataset.i,1);cmsEdit(i)});
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{collect();const arr2=getP(it,b.dataset.add);const last=arr2[arr2.length-1];arr2.push(typeof last==='object'?JSON.parse(JSON.stringify(last)):(typeof last==='number'?0:''));cmsEdit(i)});
  document.getElementById('edSave').onclick=()=>{collect();cmsSave()};
  document.querySelectorAll('[data-upl]').forEach(b=>b.onclick=async()=>{
    const url=await pickAndUpload(b);
    if(url){document.querySelector(`[data-path="${CSS.escape(b.dataset.upl)}"]`).value=url;collect();cmsEdit(i);
      document.getElementById('edMsg').innerHTML='<div class="msg-ok">📷 사진이 올라갔습니다 — 아래 💾 저장을 눌러야 사이트에 반영됩니다.</div>';}
  });
  document.getElementById('edImg').onclick=async()=>{
    const b=document.getElementById('edImg');const url=await pickAndUpload(b);
    if(url){try{await navigator.clipboard.writeText(url)}catch(e){}
      document.getElementById('edMsg').innerHTML=`<div class="msg-ok">📷 올라갔습니다 — 사진 주소가 복사됐어요. 본문 원하는 곳에 이렇게 붙여넣으세요:<br><code style="font-size:11.5px;word-break:break-all">&lt;img src="${esc(url)}" alt="" style="max-width:100%;border-radius:12px"&gt;</code></div>`;}
  };
}

async function cmsSave(){
  const msg=document.getElementById('edMsg');
  const tok=localStorage.getItem(TOK_LS);
  if(!tok)return askToken(()=>cmsSave());
  msg.innerHTML='<div class="load" style="padding:14px">저장 중…</div>';
  try{
    const body={message:`admin: ${CMS.type.name} 수정`,content:b64enc(JSON.stringify(CMS.arr,null,1)),sha:CMS.sha,branch:BR};
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${CMS.type.file}`,{method:'PUT',headers:{...ghH(tok),'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(r.status===401||r.status===403){localStorage.removeItem(TOK_LS);msg.innerHTML='<div class="msg-err">토큰이 유효하지 않습니다 — 다시 저장을 눌러 새 토큰을 입력하세요.</div>';return;}
    if(r.status===409){msg.innerHTML='<div class="msg-err">다른 곳에서 먼저 수정됐습니다 — 목록으로 돌아가 다시 불러온 뒤 수정해 주세요.</div>';return;}
    if(!r.ok)throw 0;
    CMS.sha=j.content.sha;
    msg.innerHTML='<div class="msg-ok">✅ 저장 완료 — 1~2분 뒤 사이트에 자동 반영됩니다.</div>';
  }catch(e){msg.innerHTML='<div class="msg-err">저장 실패 — 인터넷 연결 또는 토큰 권한(Contents: Read and write)을 확인하세요.</div>';}
}
