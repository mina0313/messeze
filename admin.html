<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>messeze 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#0A1930;--body:#4A5568;--mut:#8B95A7;--primary:#2B5CFF;--sky:#F5F5F5;--sky-2:#F0F0F0;--mint:#0BBF8C;--amber:#F59F1E;--red:#E2574C;--line:#E5EAF2;--sans:'Pretendard',system-ui,sans-serif;--dark:#1a1a1a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--sky);line-height:1.6;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:190px 1fr;min-height:100vh}

/* ━━━ 사이드바 ━━━ */
.sidebar{background:var(--dark);color:#fff;padding:24px 0;position:fixed;left:0;top:0;width:190px;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-logo{padding:0 16px;margin-bottom:28px;font-size:13px;font-weight:900;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.sidebar-logo svg{width:28px;height:28px;color:#fff}
.sidebar-menu{flex:1;padding:0 8px}
.sidebar-menu button{width:100%;background:none;border:0;color:#999;font-family:var(--sans);font-weight:700;font-size:13px;padding:12px 14px;text-align:left;cursor:pointer;border-radius:10px;margin:4px 0;transition:.2s}
.sidebar-menu button:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar-menu button.on{background:var(--primary);color:#fff}
.sidebar-menu .badge{background:rgba(43,92,255,.22);color:#9DB4FF;border-radius:999px;font-size:11px;padding:2px 7px;margin-left:auto;font-weight:900}
.sidebar-menu .grp{font-size:10.5px;font-weight:900;color:#5e5e5e;letter-spacing:.1em;padding:16px 14px 2px}
.sidebar-footer{padding:0 8px;font-size:11px;color:#666;border-top:1px solid rgba(255,255,255,.1);margin-top:auto;padding-top:16px}
.sidebar-footer button{background:none;border:0;color:#999;font-family:var(--sans);font-size:12px;padding:8px 14px;cursor:pointer;width:100%;text-align:left;border-radius:8px;margin:4px 0}
.sidebar-footer button:hover{color:#fff;background:rgba(255,255,255,.05)}

/* ━━━ 메인 콘텐츠 ━━━ */
main{grid-column:2;padding:32px 40px;overflow-y:auto}
.wrap{max-width:1200px}

/* ━━━ 상태 박스 ━━━ */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.bar h1{font-size:24px;font-weight:900;letter-spacing:-.02em}
.bar .cnt{font-size:13px;color:var(--mut);font-weight:700}
.bar button{margin-left:auto;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 16px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer}
.bar button:hover{border-color:var(--primary);color:var(--primary)}
.bar .out{background:none;border:0;color:var(--mut);font-size:12.5px;cursor:pointer;margin-left:0}
.bar .out:hover{color:var(--primary)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
.st b{font-size:32px;font-weight:900;display:block;color:var(--ink)}
.st span{font-size:12px;color:var(--mut);font-weight:700;display:block;margin-top:6px}
.st.new b{color:var(--primary)}

/* ━━━ 테이블 ━━━ */
.tbl{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--sky-2);text-align:left;padding:12px 14px;font-size:12px;color:var(--mut);letter-spacing:.02em;white-space:nowrap;font-weight:800}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
td.ts{white-space:nowrap;color:var(--mut);font-size:12px}
td b{font-size:14px}
td .co{color:var(--body);font-size:12.5px;display:block}
td a{color:var(--primary);font-weight:700;text-decoration:none}
td a:hover{text-decoration:underline}
select{font-family:var(--sans);font-weight:700;font-size:12.5px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;background:#fff}
select.s-신규{color:var(--primary);border-color:#B3C6FF;background:#F0F4FF}
select.s-연락중{color:var(--amber);border-color:#F5D9A8;background:#FFF7E8}
select.s-계약{color:#0B8F5C;border-color:#9FDFC4;background:#E7F8F0;font-weight:800}
select.s-보류{color:var(--red);border-color:#F2C1C1;background:#FCEFEF}
select.s-완료{color:var(--mut);border-color:var(--line);background:var(--sky-2)}

/* ━━━ 필터 탭 ━━━ */
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ftabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-family:var(--sans);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--body)}
.ftabs button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.ftabs .srch{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-family:var(--sans);font-size:13px;background:#fff}
.ftabs .srch:focus{outline:none;border-color:var(--primary);background:#fff}
.memo{font-family:var(--sans);font-size:12.5px;border:1.5px solid transparent;border-radius:8px;padding:6px 8px;background:var(--sky-2)}
.memo:focus{outline:none;border-color:var(--primary);background:#fff}

/* ━━━ 로그인 ━━━ */
body.gated .sidebar-menu{display:none}
.gate{max-width:420px;margin:80px auto;background:#fff;border-radius:20px;padding:40px;box-shadow:0 12px 40px rgba(0,0,0,.1)}
.gate .glogo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:28px}
.gate .glogo svg{width:44px;height:44px;color:var(--ink)}
.gate .glogo .wm{font-weight:900;font-size:18px;letter-spacing:-.02em;color:var(--dark)}
.gate h1{font-size:18px;letter-spacing:.05em;text-align:center;color:var(--ink);margin-bottom:24px;font-weight:800}
.gate label{display:block;font-size:12px;font-weight:800;color:var(--body);margin:14px 0 6px}
.gate input{width:100%;border:1.5px solid var(--line);background:var(--sky-2);border-radius:10px;padding:12px 14px;font-family:var(--sans);font-size:14px}
.gate input:focus{outline:none;border-color:var(--primary);background:#fff}
.gate .err{color:var(--red);font-size:12px;font-weight:700;margin-top:14px;display:none;text-align:center}
.gate button{width:100%;margin-top:18px;background:var(--primary);color:#fff;border:0;border-radius:10px;padding:14px;font-family:var(--sans);font-weight:800;font-size:15px;cursor:pointer}
.gate button:hover{background:#1E46D9}
.gate .gfoot{text-align:center;font-size:12px;color:var(--mut);margin-top:16px}

/* ━━━ 설정 안내 ━━━ */
.setup{max-width:640px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px;box-shadow:0 8px 20px rgba(0,0,0,.05)}
.setup h1{font-size:18px;font-weight:800}
.setup p{font-size:13.5px;color:var(--body);margin-top:12px;line-height:1.7}
.setup code{background:var(--sky-2);border-radius:6px;padding:2px 7px;font-size:12px}

/* ━━━ CMS ━━━ */
.cms-types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cms-types button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-family:var(--sans);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--body)}
.cms-types button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.cms-note{font-size:12.5px;color:var(--mut);margin-bottom:14px;line-height:1.6}
.cms-list{display:flex;flex-direction:column;gap:8px}
.cms-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.cms-item:hover{border-color:var(--primary)}
.cms-item b{font-size:14px}
.cms-item span{font-size:12px;color:var(--mut)}
.cms-item .idx{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--sky-2);color:var(--primary);font-weight:900;font-size:12px;display:grid;place-items:center}

/* ━━━ 편집 ━━━ */
.ed-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.ed-bar .back{background:none;border:0;color:var(--primary);font-weight:800;font-size:13px;cursor:pointer;font-family:var(--sans);padding:6px 0}
.ed-bar .sp{flex:1}
.ed-bar .save{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-family:var(--sans);font-weight:800;font-size:13px;cursor:pointer}
.ed-bar .save:hover{background:#1E46D9}
.ed-bar .del{background:#fff;border:1.5px solid #F2C1C1;color:var(--red);border-radius:10px;padding:9px 16px;font-family:var(--sans);font-weight:700;font-size:12px;cursor:pointer}
.ed-bar .dup{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 16px;font-family:var(--sans);font-weight:700;font-size:12px;cursor:pointer}
.ed-bar .dup:hover{border-color:var(--primary);color:var(--primary)}
.ed{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}
.fgrp{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;background:var(--sky-2)}
.fgrp>.glab{font-size:12px;font-weight:800;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.fgrp .rowdel{margin-left:auto;background:none;border:0;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.addrow{background:#fff;border:1.5px dashed var(--line);border-radius:8px;padding:8px;width:100%;font-family:var(--sans);font-weight:700;font-size:12px;color:var(--primary);cursor:pointer;margin-top:6px}
.fld2{margin:10px 0}
.fld2 label{display:block;font-size:12px;font-weight:800;color:var(--body);margin-bottom:6px}
.fld2 input,.fld2 textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--sans);font-size:13px;background:var(--sky-2)}
.fld2 textarea{min-height:70px;resize:vertical;line-height:1.6}
.fld2 textarea.big{min-height:200px;font-size:12px}
.fld2 input:focus,.fld2 textarea:focus{outline:none;border-color:var(--primary);background:#fff}

.msg-ok{background:#E7F8F0;border:1px solid #9FDFC4;color:#0B8F5C;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:12px}
.msg-err{background:#FCEFEF;border:1px solid #F2C1C1;color:var(--red);border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:12px}
.tok-box{background:#F0F4FF;border:1px solid #B3C6FF;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;color:var(--primary);line-height:1.6}
.tok-box input{width:100%;margin-top:8px;border:1.5px solid #B3C6FF;border-radius:8px;padding:9px 12px;font-family:var(--sans);font-size:13px;background:#fff}

.empty{padding:50px;text-align:center;color:var(--mut);font-size:13px}
.load{padding:50px;text-align:center;color:var(--mut)}

/* ━━━ 대시보드 ━━━ */
.stats.s4{grid-template-columns:repeat(4,1fr)}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.qbtns button{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.qbtns button:hover{border-color:var(--primary);color:var(--primary)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.dcard h3{font-size:13.5px;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dcard h3 .more{margin-left:auto;background:none;border:0;font-family:var(--sans);font-size:11.5px;color:var(--primary);font-weight:800;cursor:pointer}
.drow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.drow:first-of-type{border-top:0}
.drow b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .sub{color:var(--mut);font-size:11.5px;display:block}
.drow .rt{margin-left:auto;flex:0 0 auto;text-align:right}
.pill{border-radius:999px;font-size:11px;font-weight:800;padding:3px 9px;flex:0 0 auto;white-space:nowrap}
.pill.s-신규{color:var(--primary);background:#F0F4FF}
.pill.s-연락중{color:var(--amber);background:#FFF7E8}
.pill.s-계약{color:#0B8F5C;background:#E7F8F0}
.pill.s-보류{color:var(--red);background:#FCEFEF}
.pill.s-완료{color:var(--mut);background:var(--sky-2)}
.pill.lead{color:#B45309;background:#FFF7E8}
.pill.done{color:var(--mut);background:var(--sky-2)}
.dnum{font-weight:900;font-size:15px}

.upbtn{margin-top:6px;background:#fff;border:1.5px solid var(--primary);color:var(--primary);border-radius:8px;padding:8px 12px;font-family:var(--sans);font-weight:700;font-size:12px;cursor:pointer}
.upbtn:hover{background:var(--sky-2)}
.upbtn:disabled{opacity:.5;cursor:wait}
.uphint{font-size:11px;color:var(--mut);margin-top:4px}

.imgfld{display:flex;gap:12px;align-items:flex-start}
.imgfld .thumbbox{flex:0 0 auto;width:100px;height:70px;border-radius:8px;border:1px solid var(--line);background:var(--sky-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23999" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-8 8"/></svg>') center no-repeat;overflow:hidden}
.imgfld .thumbbox img{width:100%;height:100%;object-fit:cover;display:block}
.imgfld .ctrls{flex:1;min-width:0}

@media(max-width:1024px){
  body{grid-template-columns:140px 1fr}
  .sidebar{width:140px;padding:16px 0}
  .sidebar-logo{padding:0 12px;margin-bottom:20px;font-size:11px}
  .sidebar-menu button{font-size:12px;padding:10px 12px}
  main{padding:24px 20px}
}
@media(max-width:768px){
  body{grid-template-columns:1fr}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;padding:16px}
  .sidebar-logo{margin-bottom:0;margin-right:20px}
  .sidebar-menu{display:flex;gap:8px;flex:1;flex-wrap:wrap}
  .sidebar-menu button{margin:0;padding:8px 12px}
  .sidebar-menu .grp{display:none}
  .sidebar-footer{border:none;margin-top:0;padding:0;margin-left:auto}
  main{grid-column:1;padding:20px}
  .stats{grid-template-columns:1fr}
  .stats.s4{grid-template-columns:1fr 1fr}
  .dash-grid{grid-template-columns:1fr}
  .tbl{overflow-x:auto}
  table{min-width:600px}
}

.jgroup{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.jgroup h3{font-size:14px;margin-bottom:14px;color:var(--ink)}
.jgroup h3 small{font-weight:500;color:var(--mut);font-size:12px;margin-left:6px}
.jf{display:block;margin-bottom:12px}
.jf>span{display:block;font-size:12px;font-weight:800;color:var(--body);margin-bottom:6px}
.jf input[type=text],.jf textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--sans);font-size:13px;background:var(--bg,#fff);color:var(--ink)}
.jf textarea{resize:vertical;line-height:1.6}
.jf input[type=checkbox]{width:18px;height:18px}
.jf .hint{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:5px}
/* WYSIWYG 에디터 */
.rich{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.rich-bar{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);background:#F8FAFC}
.rich-bar button{border:0;background:none;font-size:12.5px;font-weight:700;color:#475569;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit}
.rich-bar button:hover{background:#EEF2F7;color:#0A1930}
.rich-bar .sep{width:1px;background:var(--line);margin:4px 5px}
.rich-ed{min-height:240px;max-height:640px;overflow:auto;padding:18px 22px;font-size:14.5px;line-height:1.75;outline:none;word-break:keep-all}
.rich.mini .rich-ed{min-height:52px;padding:12px 16px}
.rich-ed h2{font-size:20px;margin:20px 0 10px;font-weight:800}
.rich-ed h3{font-size:16.5px;margin:16px 0 8px;font-weight:800}
.rich-ed p{margin:10px 0}
.rich-ed ul,.rich-ed ol{padding-left:24px;margin:10px 0}
.rich-ed blockquote{border-left:3px solid #2B5CFF;padding:6px 14px;color:#475569;background:#F6F9FF;margin:12px 0;border-radius:0 8px 8px 0}
.rich-ed img{max-width:100%;border-radius:8px}
.rich-ed a{color:#2B5CFF;text-decoration:underline}
.rich-ed table{border-collapse:collapse;margin:12px 0}
.rich-ed th,.rich-ed td{border:1px solid var(--line);padding:7px 12px;font-size:13.5px}
.rich-src{display:none;width:100%;min-height:240px;border:0;padding:14px 16px;font:12.5px/1.6 Consolas,monospace;outline:none;resize:vertical;background:#0F172A;color:#D7E3F5}
.rich.src .rich-ed{display:none}
.rich.src .rich-src{display:block}
/* 콘텐츠 목록 테이블 */
.ctab-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px}
.ctab th{font-size:12px;color:var(--mut);font-weight:800;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.ctab td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.ctab tr:last-child td{border-bottom:0}
.ctab tbody tr:hover td{background:#FAFBFD}
.tmb{display:inline-flex;width:64px;height:44px;border-radius:8px;background:#EEF2F8;overflow:hidden;align-items:center;justify-content:center;color:var(--mut);font-size:12px;flex:0 0 auto}
.tmb img{width:100%;height:100%;object-fit:cover}
.c-tt b{display:block;font-size:14px;line-height:1.45;word-break:keep-all}
.c-tt span{font-size:12px;color:var(--mut)}
.c-act{text-align:right;white-space:nowrap}
.fvi{width:18px;height:18px;border-radius:4px;vertical-align:-3px;margin-right:8px}
.rowbtn{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--sans);margin-left:6px;color:var(--body)}
.rowbtn:hover{border-color:var(--primary);color:var(--primary)}
.rowbtn.del:hover{border-color:var(--red);color:var(--red)}
/* 진단 기록 컨트롤 */
.chk-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.chk-ctrl input[type=search]{flex:1;min-width:180px;max-width:340px;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-family:var(--sans);font-size:13px}
.chk-ctrl input[type=search]:focus{outline:none;border-color:var(--primary);background:#fff}
.chk-ctrl select{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-family:var(--sans);font-size:13px;font-weight:700;background:#fff;cursor:pointer}
.chk-ctrl .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--body);font-family:var(--sans)}
.chk-ctrl .chip:hover{border-color:var(--primary);color:var(--primary)}
.chk-ctrl .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* 문구 편집 라이브 미리보기 */
.copy-wrap.copy-live{display:grid;grid-template-columns:170px minmax(300px,1fr) minmax(360px,46%);gap:18px;align-items:start}
.copy-wrap.copy-live.noprev{grid-template-columns:185px 1fr}
.copy-prev{position:sticky;top:62px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column;height:calc(100vh - 90px)}
.cp-hd{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:#F8FAFC;font-size:12.5px;font-weight:800;color:var(--body)}
.cp-hd .dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.cp-hd .sp{flex:1}
.cp-hd button,.cp-hd a{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--body);text-decoration:none;font-family:var(--sans)}
.cp-hd button:hover,.cp-hd a:hover{border-color:var(--primary);color:var(--primary)}
.cp-wrap{flex:1;overflow:hidden;position:relative;background:#EEF1F6}
.copy-prev iframe{border:0;transform-origin:0 0;position:absolute;top:0;left:0}
@media(max-width:1200px){.copy-wrap.copy-live{grid-template-columns:170px 1fr}.copy-prev{display:none}}
/* 문구 편집 레이아웃 */
.copy-bar{position:sticky;top:0;z-index:6;background:#F7F9FC;padding:10px 0;margin-bottom:10px}
.copy-search{flex:1;max-width:380px;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-family:var(--sans);font-size:13px}
.copy-search:focus{outline:none;border-color:var(--primary);background:#fff}
.copy-wrap{display:grid;grid-template-columns:185px 1fr;gap:24px;align-items:start}
.copy-side{position:sticky;top:62px;display:flex;flex-direction:column;gap:2px}
.copy-side a{font-size:13px;font-weight:700;color:var(--body);padding:8px 12px;border-radius:8px;cursor:pointer;word-break:keep-all}
.copy-side a:hover{background:#EEF2F7;color:var(--ink)}
.copy-side a.on{background:var(--primary);color:#fff}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
.jgrid .jf.full{grid-column:1/-1}
@media(max-width:900px){.copy-wrap{grid-template-columns:1fr}.copy-side{position:static;flex-direction:row;flex-wrap:wrap}.jgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo">
    <svg viewBox="0 0 100 100" fill="none"><path d="M38 24 16 71" stroke="currentColor" stroke-width="17" stroke-linecap="round"/><path d="M72 24 51 71" stroke="#2B5CFF" stroke-width="17" stroke-linecap="round"/><circle cx="85" cy="69" r="9" fill="#2B5CFF"/></svg>
    messeze
  </div>
  <div class="sidebar-menu" id="sideMenu"></div>
  <div class="sidebar-footer">
    <button id="out" style="display:none">로그아웃</button>
  </div>
</div>

<main><div class="wrap" id="app"></div></main>

<script>
const APPS_URL = 'https://script.google.com/macros/s/AKfycbxQLdZpu5aqmDkFd4JcVT1Dk8iuQZ4vryz1UoHEgh0RxkdohTg_x0fMZaxo6_9Y7ZDN/exec';
const app = document.getElementById('app');
const KEY_LS = 'mz_admin_key';
const sideMenu = document.getElementById('sideMenu');

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const MENU=[
  {v:'dash', label:'🏠 대시보드'},
  {grp:'고객'},
  {v:'inq', label:'📥 문의 관리'},
  {v:'chk', label:'🔍 진단 기록'},
  {grp:'콘텐츠'},
  {v:'cms:blog', label:'✍️ 블로그'},
  {v:'cms:interview', label:'🎤 인터뷰'},
  {v:'cms:faq', label:'❓ FAQ'},
  {v:'cms:glossary', label:'📚 용어사전'},
  {v:'cms:service', label:'🧩 서비스 페이지'},
  {grp:'사이트'},
  {v:'copy', label:'📝 페이지 문구'},
  {v:'seo', label:'🔗 SEO 관리'},
  {v:'settings', label:'⚙️ 사이트 설정'}
];
function updateSidebar(view){
  sideMenu.innerHTML = MENU.map(m=>m.grp
    ? `<div class="grp">${m.grp}</div>`
    : `<button data-v="${m.v}" class="${view===m.v?'on':''}">${m.label}</button>`).join('');
  sideMenu.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
}

function showSetup(){
  updateSidebar('dash');
  app.innerHTML = `<div class="setup"><h1>⚙️ 아직 연결 설정 전입니다</h1>
  <p>문의 데이터를 저장할 <b>구글 시트 연결</b>이 필요합니다. 프로젝트 폴더의 <code>관리자-설정-가이드.md</code>를 따라 5분만 설정하면:</p>
  <p>① 홈페이지 문의가 구글 시트에 자동 저장되고<br>② 이 페이지에서 문의 목록 확인·상태 관리·메모가 가능해집니다.</p>
  <p style="margin-top:16px;color:var(--mut);font-size:12.5px">설정 후 발급된 웹앱 URL을 <code>admin.html</code>과 <code>index.html</code>의 <code>APPS_URL</code>에 넣으면 활성화됩니다.</p></div>`;
}

function showGate(msg){
  document.body.classList.add('gated');
  sideMenu.innerHTML = '';
  document.getElementById('out').style.display = 'none';
  app.innerHTML = `<div class="gate">
  <div class="glogo">
    <svg viewBox="0 0 100 100" fill="none"><path d="M38 24 16 71" stroke="currentColor" stroke-width="17" stroke-linecap="round"/><path d="M72 24 51 71" stroke="#2B5CFF" stroke-width="17" stroke-linecap="round"/><circle cx="85" cy="69" r="9" fill="#2B5CFF"/></svg>
    <span class="wm">messeze</span>
  </div>
  <h1>ADMIN</h1>
  <label for="gid">아이디</label>
  <input id="gid" type="text" autocomplete="username" value="${esc(localStorage.getItem('mz_admin_id')||'')}">
  <label for="key">비밀번호</label>
  <input id="key" type="password" autocomplete="current-password">
  <div class="err" id="gerr">${esc(msg||'')}</div>
  <button id="go">로그인</button>
  <div class="gfoot">messeze 관리자 페이지입니다.</div>
  </div>`;
  if(msg) document.getElementById('gerr').style.display='block';
  const tryGo = ()=>{
    const id=document.getElementById('gid').value.trim();
    const k=document.getElementById('key').value.trim();
    if(!id||!k){const e=document.getElementById('gerr');e.textContent='아이디와 비밀번호를 입력하세요.';e.style.display='block';return;}
    try{localStorage.setItem('mz_admin_id',id);}catch(e){}
    load(k);
  };
  document.getElementById('go').onclick = tryGo;
  [document.getElementById('gid'),document.getElementById('key')].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')tryGo()}));
  (localStorage.getItem('mz_admin_id')?document.getElementById('key'):document.getElementById('gid')).focus();
}

let LAST={key:null,rows:[],checks:[]};
async function load(key,view){
  app.innerHTML = '<div class="load">불러오는 중…</div>';
  try{
    const r = await fetch(APPS_URL+'?key='+encodeURIComponent(key)+'&t='+Date.now());
    const j = await r.json();
    if(!j.ok){sessionStorage.removeItem(KEY_LS);return showGate('아이디 또는 비밀번호가 올바르지 않습니다.');}
    sessionStorage.setItem(KEY_LS,key);
    document.body.classList.remove('gated');
    LAST={key:key,rows:(j.rows||[]).filter(r=>String(r.name||'')||String(r.company||'')||String(r.phone||'')||String(r.memo||'')),checks:(j.checks||[]).filter(c=>String(c.site||''))};
    document.getElementById('out').style.display = 'block';
    renderView(view||'dash');
  }catch(e){
    showGate('불러오기 실패 — 네트워크 또는 설정을 확인하세요.');
  }
}

function fmtTs(ts){
  try{const d=new Date(ts);if(isNaN(d))return String(ts);
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}catch(e){return String(ts)}
}

/* 홈페이지 주소로 문의·진단 기록을 맞춰보기 위한 정규화 */
const normSite=u=>String(u||'').toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/+$/,'').trim();

function renderDash(){
  updateSidebar('dash');
  const rows=LAST.rows||[], checks=LAST.checks||[];
  const stat=s=>rows.filter(r=>(r.status||'신규')===s).length;
  const byTs=(a,b)=>new Date(b.ts||0)-new Date(a.ts||0);
  const inqSites=new Set(rows.map(r=>normSite(r.site)).filter(Boolean));
  const leads=checks.filter(c=>normSite(c.site)&&!inqSites.has(normSite(c.site)));
  const recentInq=[...rows].sort(byTs).slice(0,5);
  const recentLeads=[...leads].sort(byTs).slice(0,5);
  const scoreCol=sc=>sc>=80?'#0BBF8C':(sc>=50?'#B45309':'#E2574C');
  app.innerHTML=`
  <div class="bar"><h1>🏠 대시보드</h1><span class="sp"></span><button id="rf">새로고침</button></div>
  <div class="stats s4">
    <div class="st new"><b>${stat('신규')}</b><span>신규 문의</span></div>
    <div class="st"><b>${stat('연락중')}</b><span>연락중</span></div>
    <div class="st" style="border:1.5px solid #9FDFC4"><b style="color:#0B8F5C">${stat('계약')}</b><span>계약</span></div>
    <div class="st"><b>${checks.length}</b><span>무료 진단 기록</span></div>
  </div>
  <div class="qbtns">
    <button data-go="inq">📥 문의 확인</button>
    <button data-go="chk">🔍 진단 기록</button>
    <button data-go="cms:blog">✍️ 블로그 글쓰기</button>
  </div>
  <div class="dash-grid">
    <div class="dcard">
      <h3>📥 최근 문의<button class="more" data-go="inq">전체 보기 →</button></h3>
      ${recentInq.length?recentInq.map(r=>{
        const st=r.status||'신규';
        return `<div class="drow"><div style="flex:1;min-width:0"><b>${esc(r.name||'')}</b><span class="sub">${esc(r.company||'')}</span></div><span class="pill s-${esc(st)}">${esc(st)}</span><span class="rt sub">${esc(fmtTs(r.ts))}</span></div>`;
      }).join(''):'<div class="empty" style="padding:24px">아직 접수된 문의가 없습니다.</div>'}
    </div>
    <div class="dcard">
      <h3>🔥 진단만 받고 문의 안 한 잠재고객<button class="more" data-go="chk">전체 보기 →</button></h3>
      ${recentLeads.length?recentLeads.map(c=>{
        const sc=Number(c.score);
        return `<div class="drow"><div style="flex:1;min-width:0"><b>${esc(normSite(c.site))}</b><span class="sub">${esc(fmtTs(c.ts))}</span></div><span class="dnum" style="color:${scoreCol(sc)}">${isNaN(sc)?'-':sc+'점'}</span></div>`;
      }).join(''):'<div class="empty" style="padding:24px">지금은 없습니다. 진단을 받은 방문자가 생기면 여기에 표시됩니다.</div>'}
    </div>
    <div class="dcard">
      <h3>📄 콘텐츠 현황</h3>
      <div id="dashCnt"><div class="load" style="padding:20px">세는 중…</div></div>
    </div>
    <div class="dcard">
      <h3>🔗 빠른 링크</h3>
      <div class="drow"><a href="${SITE}" target="_blank" rel="noopener">홈페이지 열기</a></div>
      <div class="drow"><a href="${SITE}check.html" target="_blank" rel="noopener">AI 노출 무료 진단 (고객용)</a></div>
      <div class="drow"><a href="https://github.com/${REPO}/actions" target="_blank" rel="noopener">빌드 상태 (GitHub Actions)</a></div>
    </div>
  </div>`;
  document.getElementById('rf').onclick=()=>load(LAST.key,'dash');
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  dashContentCounts();
}

async function dashContentCounts(){
  const box=document.getElementById('dashCnt');
  try{
    const results=await Promise.all(TYPES.map(t=>
      fetch(SITE+t.file+'?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)));
    box.innerHTML=TYPES.map((t,i)=>{
      const arr=results[i];
      const n=Array.isArray(arr)?arr.length:'-';
      const last=(t.key==='blog'&&Array.isArray(arr)&&arr.length)?` · 최근: ${esc(String(arr[0].date||arr[0].title||'').slice(0,24))}`:'';
      return `<div class="drow" style="cursor:pointer" data-go="cms:${t.key}"><div style="flex:1">${t.icon} ${t.name}<span class="sub">${last||''}</span></div><span class="dnum">${n}</span></div>`;
    }).join('');
    box.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
  }catch(e){box.innerHTML='<div class="empty" style="padding:20px">불러오지 못했습니다.</div>';}
}

let CHKV={q:'',sort:'new',flt:'all'};
function renderChk(){
  updateSidebar('chk');
  const list=LAST.checks||[];
  const inqBySite={};
  (LAST.rows||[]).forEach(r=>{const k=normSite(r.site);if(k&&!inqBySite[k])inqBySite[k]=r;});
  // 원본 배열 순서 기준 안정 번호 (최신이 큰 번호)
  const items=list.map((c,i)=>({c, no:list.length-i, inq:inqBySite[normSite(c.site)]}));
  app.innerHTML=`<div class="bar"><h1>🔍 진단 기록 · ${list.length}건</h1><span class="sp"></span><button id="rfc">새로고침</button></div>
  <p class="cms-note">홈페이지에서 <b>무료 AI 가시성 진단</b>을 돌린 방문자 기록입니다. <span class="pill lead">잠재고객</span>은 아직 문의하지 않은 곳이니, 먼저 연락해 보세요.</p>
  <div class="chk-ctrl">
    <input type="search" id="chkQ" placeholder="🔍 주소 검색" value="${esc(CHKV.q)}">
    <select id="chkSort">
      <option value="new">최신순</option><option value="old">오래된순</option>
      <option value="hi">점수 높은순</option><option value="lo">점수 낮은순</option>
    </select>
    <button class="chip" data-flt="all">전체</button>
    <button class="chip" data-flt="lead">잠재고객만</button>
    <button class="chip" data-flt="inq">문의함만</button>
    <span class="sp"></span><span id="chkCnt" style="font-size:12.5px;font-weight:700;color:var(--mut)"></span>
  </div>
  <div id="chkList"></div>`;
  document.getElementById('chkSort').value=CHKV.sort;
  const paint=()=>{
    let rows=items.filter(it=>{
      if(CHKV.flt==='lead'&&it.inq)return false;
      if(CHKV.flt==='inq'&&!it.inq)return false;
      if(CHKV.q&&String(it.c.site||'').toLowerCase().indexOf(CHKV.q.toLowerCase())<0)return false;
      return true;
    });
    const ts=c=>{const t=new Date(c.ts).getTime();return isNaN(t)?0:t};
    const sc=c=>{const s=Number(c.score);return isNaN(s)?-1:s};
    if(CHKV.sort==='new')rows.sort((a,b)=>ts(b.c)-ts(a.c));
    if(CHKV.sort==='old')rows.sort((a,b)=>ts(a.c)-ts(b.c));
    if(CHKV.sort==='hi')rows.sort((a,b)=>sc(b.c)-sc(a.c));
    if(CHKV.sort==='lo')rows.sort((a,b)=>sc(a.c)-sc(b.c));
    document.querySelectorAll('.chk-ctrl .chip').forEach(b=>b.classList.toggle('on',b.dataset.flt===CHKV.flt));
    document.getElementById('chkCnt').textContent=rows.length+'건 표시';
    document.getElementById('chkList').innerHTML=rows.length?`<div class="ctab-wrap"><table class="ctab"><thead><tr>
      <th style="width:46px">#</th><th>사이트</th><th style="width:160px">진단일시</th><th style="width:160px">상태</th><th style="width:90px">점수</th>
    </tr></thead><tbody>${rows.map(it=>{
      const c=it.c, s=Number(c.score), col=s>=80?'#0BBF8C':(s>=50?'#B45309':'#E2574C');
      const dom=String(c.site||'').replace(/^https?:\/\//,'').replace(/\/$/,'');
      const mark=it.inq?`<span class="pill s-${esc(it.inq.status||'신규')}">📥 문의함 · ${esc(it.inq.status||'신규')}</span>`:'<span class="pill lead">잠재고객</span>';
      return `<tr>
        <td style="color:var(--mut);font-weight:700">${it.no}</td>
        <td class="c-tt"><b><img class="fvi" src="https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(dom.split('/')[0])}" onerror="this.remove()">${esc(dom)}</b></td>
        <td style="color:var(--mut);font-size:12.5px">${esc(fmtTs(c.ts))}</td>
        <td>${mark}</td>
        <td style="font-weight:900;font-size:15px;color:${col}">${isNaN(s)?'-':s+'점'}</td>
      </tr>`}).join('')}</tbody></table></div>`:'<div class="empty">조건에 맞는 기록이 없습니다.</div>';
  };
  document.getElementById('chkQ').oninput=e=>{CHKV.q=e.target.value;paint();};
  document.getElementById('chkSort').onchange=e=>{CHKV.sort=e.target.value;paint();};
  document.querySelectorAll('.chk-ctrl .chip').forEach(b=>b.onclick=()=>{CHKV.flt=b.dataset.flt;paint();});
  paint();
  const _rfc=document.getElementById('rfc'); if(_rfc)_rfc.onclick=()=>load(LAST.key,'chk');
}

function render(key, rows){
  updateSidebar('inq');
  const stat = s => rows.filter(r=>(r.status||'신규')===s).length;
  const OPTS = ['신규','연락중','계약','보류','완료'];
  const chkBySite={};
  (LAST.checks||[]).forEach(c=>{const k=normSite(c.site);if(k&&!(k in chkBySite))chkBySite[k]=Number(c.score);});
  const fmt = r => {
    const st = r.status||'신규';
    const d = r.ts ? new Date(r.ts) : null;
    const ts = d ? `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}<br>${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '';
    const sc = chkBySite[normSite(r.site)];
    const scBadge = (sc!==undefined&&!isNaN(sc)) ? `<span class="pill" style="color:${sc>=80?'#0B8F5C':(sc>=50?'#B45309':'#E2574C')};background:var(--sky-2);margin-left:6px">진단 ${sc}점</span>` : '';
    const site = r.site ? `<a href="${esc(r.site)}" target="_blank" rel="noopener">${esc(String(r.site).replace(/^https?:\/\//,'').slice(0,20))}</a>${scBadge}` : '<span style="color:var(--mut)">—</span>';
    return `<tr>
      <td class="ts">${ts}</td>
      <td><b>${esc(r.name)}</b><span class="co">${esc(r.company)}</span></td>
      <td><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></td>
      <td>${site}</td>
      <td><select class="s-${st}" data-row="${r.row}">${OPTS.map(o=>`<option ${o===st?'selected':''}>${o}</option>`).join('')}</select></td>
      <td><input class="memo" data-row="${r.row}" value="${esc(r.memo)}" placeholder="메모"></td>
    </tr>`;
  };
  let fltSt = '전체', fltQ = '';
  const visible = () => rows.filter(r=>{
    const st = r.status||'신규';
    if(fltSt!=='전체' && st!==fltSt) return false;
    if(fltQ){
      const hay = [r.name,r.company,r.phone,r.site,r.memo].join(' ').toLowerCase();
      if(!hay.includes(fltQ.toLowerCase())) return false;
    }
    return true;
  });
  app.innerHTML = `
  <div class="bar"><h1>📥 문의 관리</h1><span class="cnt" id="cnt"></span>
    <button id="csv">CSV 다운로드</button><button id="rf">새로고침</button><button class="out" id="out2">로그아웃</button></div>
  <div class="stats">
    <div class="st new"><b>${stat('신규')}</b><span>신규</span></div>
    <div class="st"><b>${stat('연락중')}</b><span>연락중</span></div>
    <div class="st" style="border:1.5px solid #9FDFC4"><b style="color:#0B8F5C">${stat('계약')}</b><span>계약</span></div>
  </div>
  <div class="ftabs">

async function pickAndUpload(btn){return new Promise(resolve=>{const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.onchange=async()=>{const f=fi.files[0];if(!f)return resolve(null);askToken(async tok=>{btn.disabled=true;const orig=btn.textContent;btn.textContent='올리는 중…';try{let blob=f;if(/image\/(jpe?g|png|webp)/.test(f.type)&&f.size>250*1024){const bmp=await createImageBitmap(f);const sc=Math.min(1,1600/bmp.width);const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));}const buf=new Uint8Array(await blob.arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode(...buf.subarray(i,i+8192));const ext=blob.type==='image/jpeg'?'jpg':(f.name.split('.').pop()||'jpg').toLowerCase();const name=`up-${Date.now()}.${ext}`;const r=await fetch(`https://api.github.com/repos/${REPO}/contents/assets/uploads/${name}`,{method:'PUT',headers:{...ghH(tok),'Content-Type':'application/json'},body:JSON.stringify({message:'admin: 사진 '+name,content:btoa(bin),branch:BR})});if(r.status===401||r.status===403){localStorage.removeItem(TOK_LS);alert('토큰이 유효합니다. 버튼을 다시 눌러 새 토큰을 입력하세요.');return resolve(null);}if(!r.ok)throw 0;resolve(SITE+'assets/uploads/'+name);}catch(e){alert('업로드 실패 — 인터넷 또는 토큰을 확인하세요.');resolve(null);}finally{btn.disabled=false;btn.textContent=orig;}})};fi.click();});}

const getP=(o,p)=>p.split('.').reduce((a,k)=>a[k],o);const setP=(o,p,v)=>{const ks=p.split('.');const last=ks.pop();let cur=o;for(const k of ks)cur=cur[k];cur[last]=v;};
function cmsEdit(i){CMS.idx=i;const it=CMS.arr[i],t=CMS.type;document.getElementById('cmsBody').innerHTML=`<div class="ed-bar"><button class="back" id="edBack">← ${t.name}</button><span class="sp"></span><button class="dup" id="edDup">복제</button><button class="del" id="edDel">삭제</button><button class="save" id="edSave">💾 저장</button></div><div id="edMsg"></div><div class="ed">${Object.entries(it).map(([k,v])=>fld(v,k,k)).join('')}</div>`;const collect=()=>{document.querySelectorAll('#cmsBody [data-path]').forEach(el=>{const v=el.dataset.rich?el.innerHTML.trim():(el.type==='number'?Number(el.value):el.value);setP(it,el.dataset.path,v);});};document.getElementById('edBack').onclick=()=>{collect();cmsList()};document.getElementById('edDup').onclick=()=>{collect();CMS.arr.splice(i+1,0,JSON.parse(JSON.stringify(it)));cmsEdit(i+1)};document.getElementById('edDel').onclick=()=>{if(confirm('삭제할까요?')){CMS.arr.splice(i,1);cmsList()}};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{collect();getP(it,b.dataset.del).splice(+b.dataset.i,1);cmsEdit(i)});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{collect();const arr2=getP(it,b.dataset.add);const last=arr2[arr2.length-1];const tplKey=b.dataset.add.split('.').pop();if(last===undefined){arr2.push(ADD_TPL[tplKey]?JSON.parse(JSON.stringify(ADD_TPL[tplKey])):'');}else{arr2.push(typeof last==='object'?JSON.parse(JSON.stringify(last)):(typeof last==='number'?0:''));}cmsEdit(i)});document.getElementById('edSave').onclick=()=>{collect();cmsSave()};document.querySelectorAll('[data-upl]').forEach(b=>b.onclick=async()=>{const url=await pickAndUpload(b);if(url){document.querySelector(`[data-path="${CSS.escape(b.dataset.upl)}"]`).value=url;collect();cmsEdit(i);}});initRich(document.getElementById('cmsBody'));}

let JST={key:null, data:null, sha:null};

async function jsonEditHome(key, msg){
  updateSidebar(key);
  const cfg=JEDIT[key];
  app.innerHTML=`<h1 style="margin:26px 0 6px">${cfg.icon} ${cfg.name}</h1>
    <p class="cms-note">${cfg.note}</p>${msg?`<div class="msg-ok">${esc(msg)}</div>`:''}
    <div id="jBody"><div class="load">불러오는 중…</div></div>`;
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${cfg.file}?ref=${BR}&t=${Date.now()}`,{headers:ghH(localStorage.getItem(TOK_LS))});
    if(!r.ok)throw 0;
    const j=await r.json();
    JST={key:key, data:JSON.parse(b64dec(j.content)), sha:j.sha};
    jsonEditRender();
  }catch(e){document.getElementById('jBody').innerHTML='<div class="msg-err">불러오기 실패 — 인터넷을 확인하세요.</div>';}
}

function jFld(path, val, label){
  const long=/description|headCode|address/.test(path);
  const hint=path.includes('.') ? '' : (JHINT[path]||'');
  const hintHtml=hint?`<span class="hint">${esc(hint)}</span>`:'';
  if(typeof val==='boolean')
    return `<label class="jf"><span>${label}</span><input type="checkbox" data-jp="${path}" ${val?'checked':''}>${hintHtml}</label>`;
  if(!path.includes('.')&&/^(favicon|appleIcon|ogImage)$/.test(path))
    return `<label class="jf"><span>${label}</span><div class="imgfld"><div class="thumbbox">${val?`<img src="${esc(val)}" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div><div class="ctrls"><input type="text" data-jp="${path}" value="${esc(val)}" placeholder="이미지 주소 또는 업로드"><button type="button" class="upbtn" data-upl="${path}">📷 업로드</button></div></div>${hintHtml}</label>`;
  return `<label class="jf"><span>${label}</span>${long
    ? `<textarea data-jp="${path}" rows="${path.includes('headCode')?4:2}">${esc(val)}</textarea>`
    : `<input type="text" data-jp="${path}" value="${esc(val)}">`}${hintHtml}</label>`;
}

function jsonEditRender(){
  const d=JST.data, body=document.getElementById('jBody');
  let html='<div class="ed-bar"><b>내용 편집</b><span class="sp"></span><button class="dup" id="jSave">저장</button></div><div id="jMsg"></div>';
  if(JST.key==='seo'){
    const G=[['사이트 기본',['siteName','siteUrl','themeColor']],
             ['아이콘',['favicon','appleIcon']],
             ['공유(SNS) 미리보기',['ogImage','ogTitle','ogDescription','twitterCard']],
             ['검색엔진 등록·분석',['googleVerify','naverVerify','gaId']]];
    G.forEach(([name,keys])=>{
      html+=`<div class="jgroup"><h3>${name}</h3>`;
      keys.forEach(k=>{ if(k in d) html+=jFld(k, d[k], JLABEL[k]||k); });
      html+='</div>';
    });
    Object.keys(d.pages||{}).forEach(pg=>{
      html+=`<div class="jgroup"><h3>${esc(pg)} <small>${esc(d.pages[pg].file||'')}</small></h3>`;
      ['title','description','keywords','noindex','headCode'].forEach(k=>{
        if(k in d.pages[pg]) html+=jFld(`pages.${pg}.${k}`, d.pages[pg][k], JLABEL[k]||k);
      });
      html+='</div>';
    });
  }else{
    html+='<div class="jgroup"><h3>기본 정보</h3>';
    Object.keys(d).forEach(k=>{ html+=jFld(k, d[k], JLABEL[k]||k); });
    html+='</div>';
  }
  body.innerHTML=html;
  document.getElementById('jSave').onclick=jsonEditSave;
  document.querySelectorAll('#jBody [data-upl]').forEach(b=>b.onclick=async()=>{
    const url=await pickAndUpload(b);
    if(url){
      const inp=document.querySelector(`[data-jp="${CSS.escape(b.dataset.upl)}"]`);
      if(inp)inp.value=url;
      const tb=b.closest('.imgfld').querySelector('.thumbbox');
      if(tb)tb.innerHTML=`<img src="${url}" referrerpolicy="no-referrer">`;
    }
  });
}

function jsonEditCollect(){
  document.querySelectorAll('[data-jp]').forEach(el=>{
    const path=el.dataset.jp.split('.');
    let t=JST.data;
    for(let i=0;i<path.length-1;i++) t=t[path[i]];
    t[path[path.length-1]] = el.type==='checkbox' ? el.checked : el.value.trim();
  });
}


/* ===== 페이지 문구 편집기 ===== */
const COPY_PAGES={home:'메인 페이지', pricing:'요금 페이지', check:'AI 노출 무료 진단', tools:'무료 도구', faq:'FAQ 페이지', interview:'인터뷰 페이지'};
const COPY_SECTIONS={hero:'히어로 (첫 화면)', why:'WHY NOW (마케팅 고민)', market:'시장 기회',
  brand:'AI가 아는 브랜드', sim:'업종별 시뮬레이션', service:'서비스 4단계',
  interview:'고객 인터뷰', price:'요금',
  tier:'요금제 카드', compare:'플랜 비교표', common:'공통 제공', faq:'자주 묻는 질문',
  explain:'진단 항목 안내', card1:'첫 번째 도구 카드', card2:'두 번째 도구 카드'};
const COPY_FIELDS={eyebrow:'작은 제목', title:'큰 제목', lead:'설명문', h1:'헤드라인 1',
  h21:'헤드라인 2', h22:'헤드라인 3', glassCard:'우측 상단 카드', sloganCard:'우측 하단 카드',
  name:'플랜 이름', price:'월 요금', price3:'3개월 결제', desc:'설명', fit:'적합 대상', caveat:'하단 안내문'};
const TIER_NAMES={basic:'베이직', premium:'프리미엄', enterprise:'엔터프라이즈'};

async function copyHome(msg){
  updateSidebar('copy');
  const cfg=JEDIT.copy;
  app.innerHTML=`<h1 style="margin:26px 0 6px">${cfg.icon} ${cfg.name}</h1>
    <p class="cms-note">${cfg.note}</p>${msg?`<div class="msg-ok">${esc(msg)}</div>`:''}
    <div id="jBody"><div class="load">불러오는 중…</div></div>`;
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${cfg.file}?ref=${BR}&t=${Date.now()}`,{headers:ghH(localStorage.getItem(TOK_LS))});
    if(!r.ok)throw 0;
    const j=await r.json();
    JST={key:'copy', data:JSON.parse(b64dec(j.content)), sha:j.sha};
    copyRender();
  }catch(e){document.getElementById('jBody').innerHTML='<div class="msg-err">불러오기 실패 — 인터넷을 확인하세요.</div>';}
}

function copyRender(page){
  const pages=Object.keys(COPY_PAGES).filter(p=>JST.data[p]);
  const cur=page||pages[0];
  const src=JST.data[cur]||{};
  const groups={};
  Object.keys(src).forEach(k=>{const sec=k.split('.')[0];(groups[sec]=groups[sec]||[]).push(k);});
  const order=Object.keys(COPY_SECTIONS).filter(s=>groups[s]);
  let html='<div class="cms-types">'+pages.map(p=>`<button data-pg="${p}" class="${p===cur?'on':''}">${COPY_PAGES[p]}</button>`).join('')+'</div>';
  html+='<div class="ed-bar copy-bar"><b>문구 편집</b><input type="search" id="copyQ" class="copy-search" placeholder="🔍 문구 검색 — 제목·내용으로 바로 찾기"><span class="sp"></span><button class="dup" id="jSave">💾 저장</button></div><div id="jMsg"></div>';
  const COPY_FILES={home:'index.html',pricing:'pricing.html',check:'check.html',tools:'tools.html',faq:'faq.html',interview:'interview.html'};
  html+='<div class="copy-wrap copy-live"><nav class="copy-side" id="copySide">'+order.map((s,i)=>`<a data-sec="${s}" class="${i===0?'on':''}">${COPY_SECTIONS[s]}</a>`).join('')+'</nav><div class="copy-main">';
  order.forEach(sec=>{
    html+=`<div class="jgroup" id="cg-${sec}"><h3>${COPY_SECTIONS[sec]}</h3><div class="jgrid">`;
    groups[sec].forEach(k=>{
      const parts=k.split('.');
      let label;
      if(sec==='tier'&&parts.length===3) label=(TIER_NAMES[parts[1]]||parts[1])+' · '+(COPY_FIELDS[parts[2]]||parts[2]);
      else label=COPY_FIELDS[parts[parts.length-1]]||parts[parts.length-1];
      const val=src[k]||'';
      const long=val.length>40||val.includes('<br');
      html+=`<label class="jf ${long?'full':''}" data-q="${esc((label+' '+val).toLowerCase())}"><span>${label}</span>${long
        ? `<textarea data-jp="${cur}.${k}" rows="2">${esc(val)}</textarea>`
        : `<input type="text" data-jp="${cur}.${k}" value="${esc(val)}">`}</label>`;
    });
    html+='</div></div>';
  });
  html+='</div>';
  const pvFile=COPY_FILES[cur];
  html+=`<div class="copy-prev"><div class="cp-hd"><span class="dot"></span>실시간 미리보기 — 입력하면 바로 반영됩니다<span class="sp"></span><a href="${pvFile}" target="_blank" rel="noopener">↗ 새 창</a></div><div class="cp-wrap" id="cpWrap"><iframe id="copyPrev" src="${pvFile}"></iframe></div></div>`;
  html+='</div>';
  document.getElementById('jBody').innerHTML=html;
  document.getElementById('jSave').onclick=jsonEditSave;
  document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>copyRender(b.dataset.pg));
  /* ── 라이브 미리보기 동기화 ── */
  const pv=document.getElementById('copyPrev');
  const pvDoc=()=>{try{return pv.contentDocument}catch(e){return null}};
  const pvEl=jp=>{const d=pvDoc();if(!d)return null;const key=jp.split('.').slice(1).join('.');return d.querySelector(`[data-copy="${CSS.escape(key)}"]`);};
  const applyField=el=>{const t=pvEl(el.dataset.jp);if(t)t.innerHTML=el.value;};
  const applyAll=()=>{document.querySelectorAll('.copy-main [data-jp]').forEach(applyField);};
  const flash=t=>{t.scrollIntoView({block:'center',behavior:'smooth'});t.style.outline='2px solid #2B5CFF';t.style.outlineOffset='3px';clearTimeout(t._fo);t._fo=setTimeout(()=>{t.style.outline='';t.style.outlineOffset='';},1600);};
  document.querySelectorAll('.copy-main [data-jp]').forEach(el=>{
    el.addEventListener('input',()=>applyField(el));
    el.addEventListener('focus',()=>{const t=pvEl(el.dataset.jp);if(t)flash(t);});
  });
  /* 데스크톱 폭(1280px)으로 렌더 후 패널에 맞게 축소 */
  const PV_W=1280, wrap=document.getElementById('cpWrap');
  const fit=()=>{if(!wrap)return;const s=wrap.clientWidth/PV_W;pv.style.width=PV_W+'px';pv.style.height=Math.round(wrap.clientHeight/s)+'px';pv.style.transform=`scale(${s})`;};
  window.addEventListener('resize',fit);
  fit();
  pv.onload=()=>{
    fit();
    applyAll(); // 저장 전 수정값을 미리보기에 재적용
    const d=pvDoc();if(!d)return;
    const hide=d.createElement('style');hide.textContent='#mchat{display:none!important}';d.head.appendChild(hide); // 상담 위젯은 편집에 방해되니 숨김
    d.querySelectorAll('[data-copy]').forEach(t=>{
      t.style.cursor='pointer';t.title='클릭하면 편집칸으로 이동';
      t.addEventListener('click',e=>{
        e.preventDefault();e.stopPropagation();
        const f=document.querySelector(`.copy-main [data-jp="${CSS.escape(cur+'.'+t.dataset.copy)}"]`);
        if(f){f.scrollIntoView({block:'center',behavior:'smooth'});f.focus({preventScroll:true});
          f.style.boxShadow='0 0 0 3px rgba(43,92,255,.35)';setTimeout(()=>f.style.boxShadow='',1600);}
      },true);
    });
  };
  // 섹션 사이드바: 클릭 점프 + 스크롤 하이라이트
  const side=document.getElementById('copySide');
  const links=[...side.querySelectorAll('a')];
  links.forEach(a=>a.onclick=()=>{
    const g=document.getElementById('cg-'+a.dataset.sec);
    if(g)window.scrollTo({top:g.getBoundingClientRect().top+window.scrollY-70,behavior:'smooth'});
  });
  const spy=()=>{
    let idx=0;
    links.forEach((a,i)=>{const g=document.getElementById('cg-'+a.dataset.sec);if(g&&g.getBoundingClientRect().top<=130)idx=i;});
    links.forEach((a,i)=>a.classList.toggle('on',i===idx));
  };
  window.addEventListener('scroll',spy,{passive:true});
  // 검색: 라벨·내용 매칭 필드만 표시
  document.getElementById('copyQ').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('.copy-main .jf').forEach(f=>{f.style.display=(!q||f.dataset.q.includes(q))?'':'none';});
    document.querySelectorAll('.copy-main .jgroup').forEach(g=>{
      const any=[...g.querySelectorAll('.jf')].some(f=>f.style.display!=='none');
      g.style.display=any?'':'none';
    });
  };
}

async function jsonEditSave(){
  const msg=document.getElementById('jMsg');
  const tok=localStorage.getItem(TOK_LS);
  if(!tok)return askToken(()=>jsonEditSave());
  jsonEditCollect();
  const cfg=JEDIT[JST.key];
  msg.innerHTML='<div class="load">저장 중…</div>';
  try{
    const body={message:`admin: ${cfg.name} 수정`,content:b64enc(JSON.stringify(JST.data,null,2)),sha:JST.sha,branch:BR};
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${cfg.file}`,{method:'PUT',headers:{...ghH(tok),'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(r.status===401||r.status===403){localStorage.removeItem(TOK_LS);msg.innerHTML='<div class="msg-err">토큰이 유효하지 않습니다.</div>';return;}
    if(r.status===409){msg.innerHTML='<div class="msg-err">다른 곳에서 수정됐습니다 — 다시 불러오세요.</div>';return;}
    if(!r.ok)throw 0;
    JST.sha=j.content.sha;
    msg.innerHTML='<div class="msg-ok">✅ 저장 완료 — 1~2분 뒤 반영됩니다.</div>';
  }catch(e){msg.innerHTML='<div class="msg-err">저장 실패 — 잠시 후 다시 시도하세요.</div>';}
}


function renderView(v){
  if(v==='chk')return renderChk();
  if(v==='dash')return renderDash();
  return render(LAST.key, LAST.rows);
}

function go(v){
  updateSidebar(v);
  if(v.startsWith('cms:'))return cmsHome(v.slice(4));
  if(v==='copy')return copyHome();
  if(v==='seo')return jsonEditHome('seo');
  if(v==='settings')return jsonEditHome('settings');
  if(!APPS_URL)return showSetup();
  const saved=sessionStorage.getItem(KEY_LS);
  if(!saved)return showGate();
  // 이미 받아온 데이터가 있으면 즉시 표시 (Apps Script 재조회 생략)
  if(LAST.key===saved && (LAST.rows.length || LAST.checks.length)){
    document.body.classList.remove('gated');
    document.getElementById('out').style.display='block';
    return renderView(v);
  }
  load(saved,v);
}

document.getElementById('out').onclick = ()=>{LAST={key:null,rows:[],checks:[]};sessionStorage.removeItem(KEY_LS);showGate();};
go('dash');
</script>
