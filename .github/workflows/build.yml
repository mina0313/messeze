name: auto-build
on:
  push:
    branches: [master]
    paths:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pages from data
        run: |
          python build-blog.py
          python build-glossary.py
          python build-interview.py
          python build-faq.py
          python build-services.py
          python build-copy.py
      - name: Inject SEO meta and rebuild sitemap
        run: |
          python inject-meta.py
          python build-sitemap.py
      - name: Commit generated pages
        run: |
          git config user.name "messeze-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto-build: 콘텐츠 데이터 변경 반영"
          git push
